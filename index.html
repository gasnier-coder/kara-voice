<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00ff66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KaraVoice">
<link rel="apple-touch-icon" href="icon-192.jpg">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.jpg">
<title>Kara Voice - Ma Kara-Box</title><style>/* =========================================================
   1. VARIABLES / BASE
   ========================================================= */

:root {
  --bg:#10141d;
  --p:#18202d;
  --p2:#222c3d;
  --t:#ffffff;
  --m:#cbd5e1;
  --neon-green:#00ff66;
  --neon-red:#ff334b;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:linear-gradient(135deg,#0a0d14,#141b26);
  color:var(--t);
  font-family:Segoe UI,Arial,sans-serif;
  font-size:22px;
}


/* =========================================================
   2. HEADER
   ========================================================= */

header {
  padding:20px 32px 22px;
  background:#0d111a;
  position:sticky;
  top:0;
  z-index:5;
  border-bottom:2px solid #283347;
}


/* ----- Identité / titre ----- */

.header-title {
  /* Bloc regroupant logo, titre et sous-titre */
}

.logo-title {
  display:flex;
  align-items:center;
  gap:220px;
}

.micro-logo {
  height:110px;
  width:300px;
  object-fit:cover;
  border-radius:16px;
  box-shadow:0 0 15px rgba(0,255,102,0.6),0 0 30px rgba(255,51,75,0.4);
  flex-shrink:0;
}

.kara-title {
  font-size:110px;
  font-weight:900;
  letter-spacing:1px;
  display:flex;
  align-items:baseline;
  gap:4px;
  font-family:Impact,'Arial Black',Segoe UI,sans-serif;
  text-transform:none;
}

.kara {
  color:#0a0a0a;
  text-shadow:0 0 4px #ff0000,0 0 10px #ff0000,0 0 20px #ff0000,2px 2px 0 #000;
  -webkit-text-stroke:1px #ff1a1a;
}

.voice {
  color:#0a0a0a;
  text-shadow:0 0 4px #00ff44,0 0 10px #00ff44,0 0 20px #00ff44,2px 2px 0 #000;
  -webkit-text-stroke:1px #00ff44;
}

.sep {
  color:#444;
  text-shadow:0 0 8px rgba(255,255,255,0.5);
  font-size:40px;
  margin:0 2px;
}

.sub {
  color:var(--m);
  margin-top:8px;
  font-size:18px;
}


/* ----- Commandes / boutons ----- */

.header-controls {
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:18px;
}

input,
button,
textarea {
  font:inherit;
  border-radius:12px;
  border:2px solid #36445a;
}

input {
  background:var(--p2);
  color:var(--t);
  padding:16px 18px;
  font-size:22px;
}

#search {
  flex:1;
  min-width:280px;
}

button {
  padding:16px 24px;
  background:var(--neon-green);
  color:#000;
  border:0;
  font-weight:800;
  cursor:pointer;
  font-size:22px;
  box-shadow:0 0 10px rgba(0,255,102,0.4);
}

button.secondary {
  background:#323e52;
  color:#fff;
  box-shadow:none;
}

button.blue {
  background:#3b82f6;
  color:#fff;
  box-shadow:0 0 12px rgba(59,130,246,0.5);
}

.filelabel {
  display:inline-block;
  padding:16px 24px;
  background:var(--neon-green);
  color:#000;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
  font-size:22px;
  box-shadow:0 0 12px rgba(0,255,102,0.5);
}

.filelabel input {
  display:none;
}


/* =========================================================
   3. CONTENU PRINCIPAL / LISTE
   ========================================================= */

main {
  max-width:1250px;
  margin:auto;
  padding:28px 32px 70px;
}

.status {
  display:flex;
  justify-content:space-between;
  color:var(--m);
  margin:10px 0 20px;
  font-size:22px;
  font-weight:700;
}

table {
  width:100%;
  border-collapse:separate;
  border-spacing:0 10px;
}

th {
  text-align:left;
  color:#a0aec0;
  font-size:18px;
  padding:8px 16px;
  text-transform:uppercase;
  letter-spacing:1px;
}

td {
  background:var(--p);
  padding:20px 16px;
  font-size:24px;
}

.num {
  width:90px;
  text-align:center;
  font-weight:900;
  color:var(--neon-green);
  font-size:26px;
  text-shadow:0 0 8px rgba(0,255,102,0.4);
}

.artist {
  color:#f1f5f9;
  font-weight:600;
}

.title {
  font-weight:800;
}

tr td:first-child {
  border-radius:14px 0 0 14px;
}

tr td:last-child {
  border-radius:0 14px 14px 0;
  text-align:right;
}

.play {
  padding:12px 22px;
  background:var(--neon-red);
  color:#fff;
  border-radius:12px;
  font-size:20px;
  font-weight:800;
  box-shadow:0 0 10px rgba(255,51,75,0.4);
  cursor:pointer;
  border:none;
}

.empty {
  padding:60px;
  text-align:center;
  color:var(--m);
  background:var(--p);
  border-radius:16px;
  font-size:24px;
}


/* =========================================================
   4. LECTEUR VIDÉO
   ========================================================= */

#videoBox {
  display:none;
  background:#06080c;
  border-radius:18px;
  padding:18px;
  margin-bottom:28px;
  border:2px solid var(--neon-green);
  box-shadow:0 0 20px rgba(0,255,102,0.3);
}

video {
  width:100%;
  max-height:68vh;
  border-radius:12px;
  background:#000;
}

.now {
  padding:12px 8px 10px;
  font-weight:800;
  font-size:26px;
  color:var(--neon-green);
  text-shadow:0 0 8px rgba(0,255,102,0.4);
}

.hint {
  font-size:16px;
  color:var(--m);
  padding:8px;
}


/* =========================================================
   5. FENÊTRE D'IMPORT
   ========================================================= */

#pasteModal {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  z-index:100;
  padding:20px;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:var(--p);
  padding:30px;
  border-radius:18px;
  max-width:800px;
  width:100%;
  border:2px solid var(--neon-green);
  box-shadow:0 0 25px rgba(0,255,102,0.3);
}

textarea {
  width:100%;
  height:280px;
  background:#0d111a;
  color:#fff;
  padding:15px;
  margin:15px 0;
  border-color:#283347;
  font-size:18px;
}


/* =========================================================
   6. AFFICHAGE MOBILE
   ========================================================= */

@media(max-width:650px) {
  main {
    padding:15px;
  }

  .header-controls {
    display:grid;
  }

  th:nth-child(2),
  td:nth-child(2) {
    display:none;
  }

  .status {
    flex-direction:column;
  }

  .logo-title img {
    height:54px;
  }
}</style></head><body>
<header>

  <!-- =====================================================
       IDENTITÉ : LOGO / TITRE / SOUS-TITRE
       ===================================================== -->
  <div class="header-title">
    <div class="logo-title">
      <img src=https://github.com/gasnier-coder/kara-voice/blob/main/HAUT%20CDV%20GASNIER%20TECH.png?raw=true alt="Kara Voice" class="micro-logo">
      <div class="kara-title">
        <span class="kara">Kara</span>
        <span class="sep"> - </span>
        <span class="voice">Voice</span>
      </div>
    </div>
    <div class="sub"></div>
  </div>

  <!-- =====================================================
       COMMANDES : RECHERCHE / IMPORT / AFFICHAGE
       ===================================================== -->
  <div class="header-controls"><input id="search" type="search" placeholder="🔎 Tapez un N°">
<label class="filelabel">📁 Dossier MP4<input id="folder" type="file" webkitdirectory directory multiple></label>
<button class="blue" id="openPasteBtn">📋 Import liste</button>
<button class="secondary" id="fullscreenBtn">🖥️ Plein écran</button>
<button class="secondary" id="resetBtn">🔄 Vider la liste</button></div></header>

<main>
<div id="pasteModal"><div class="modal-content">
  <h2 style="margin-top:0;color:var(--neon-green)">Import liste</h2>
  <p style="font-size:20px;color:var(--m)">Copiez vos 3 colonnes prises dans Excel, faites <strong>Ctrl+C</strong> puis collez ci-dessous avec <strong>Ctrl+V</strong> :</p>
  <textarea id="pasteInput" placeholder="Collez vos colonnes ici..."></textarea>
  <div style="display:flex;gap:12px;justify-content:flex-end">
    <button id="importPasteBtn">Valider l'importation</button>
    <button class="secondary" id="closePasteBtn">Annuler</button>
  </div>
</div></div>

<div id="videoBox"><div class="now" id="now"></div><video id="video" controls></video><div class="hint">Les vidéos restent sur mon PC : aucun fichier n'est envoyé sur Internet.</div></div>
<div class="status"><span id="count"></span><span id="folderStatus">Aucun dossier MP4 sélectionné</span></div>
<table><thead><tr><th>N°</th><th>INTERPRÈTE</th><th>TITRE</th><th></th></tr></thead><tbody id="list"></tbody></table></main>

<script>
/* =========================================================
   7. JAVASCRIPT
   ========================================================= */

/* ----- DONNÉES ET ÉTAT DE L'APPLICATION ----- */
const defaultSongs=[{"num":1,"artist":"ANDRE VERCHUREN","title":"Tu es le chou-chou de mon cœur"},{"num":2,"artist":"ANNIE CORDY","title":"La bonne du cure"},{"num":3,"artist":"BARBARA","title":"L'aigle noir"}];

let songs = JSON.parse(localStorage.getItem("karabox_songs")) || defaultSongs;
let fileList = [];
let currentUrl = null;

/* ----- SAUVEGARDE ----- */
function saveSongs() { localStorage.setItem("karabox_songs", JSON.stringify(songs)); }

/* ----- NORMALISATION DES NOMS DE FICHIERS ----- */
const norm = s => s ? s.toLowerCase()
  .replace(/œ/g, "oe").replace(/æ/g, "ae")
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/\.(mp4|m4v|mov|mkv)$/i, "")
  .replace(/[^a-z0-9]+/g, " ")
  .trim() : "";

const esc = x => x.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ----- AFFICHAGE / RECHERCHE DE LA LISTE ----- */
function render() {
  let q = search.value.trim().toLowerCase();
  let arr = songs.filter(s => {
    if (!q) return true;
    if (s.num.toString() === q) return true;
    return (s.num + " " + s.artist + " " + s.title).toLowerCase().includes(q);
  });

  arr.sort((a, b) => a.num - b.num);
  count.textContent = arr.length + " chanson" + (arr.length > 1 ? "s" : "");
  list.innerHTML = "";

  if (!arr.length) {
    list.innerHTML = '<tr><td colspan="4"><div class="empty">Aucune chanson trouvée.</div></td></tr>';
    return;
  }

  for (const s of arr) {
    let tr = document.createElement("tr");
    tr.innerHTML = `<td class="num">${s.num}</td><td class="artist">${esc(s.artist)}</td><td class="title">${esc(s.title)}</td><td><button class="play">▶ Lire</button></td>`;
    tr.querySelector("button").onclick = () => playSong(s);
    list.appendChild(tr);
  }
}

/* ----- RECHERCHE DU FICHIER VIDÉO ----- */
function findMatchingFile(s) {
  if (!fileList.length) return null;
  const targetArtist = norm(s.artist);
  const targetTitle = norm(s.title);
  const numStr = s.num.toString();
  const numPadded = s.num < 10 ? "0" + s.num : (s.num < 100 ? "0" + s.num : numStr);

  let match = fileList.find(f => norm(f.name).includes(targetArtist) && norm(f.name).includes(targetTitle));
  if (match) return match;

  match = fileList.find(f => norm(f.name).includes(targetTitle));
  if (match) return match;

  const titleWords = targetTitle.split(' ').filter(w => w.length > 3);
  if (titleWords.length) {
    match = fileList.find(f => titleWords.every(w => norm(f.name).includes(w)));
    if (match) return match;
  }

  return fileList.find(f => {
    const fn = norm(f.name);
    return new RegExp("(^|\\D)" + numStr + "(\\D|$)").test(fn) || new RegExp("(^|\\D)" + numPadded + "(\\D|$)").test(fn);
  });
}

/* ----- LECTURE D'UNE CHANSON ----- */
function playSong(s) {
  let file = findMatchingFile(s);
  if (!file) {
    alert("Fichier MP4 introuvable pour :\n" + s.artist + " - " + s.title + "\n\nSélectionnez le dossier contenant vos fichiers vidéo.");
    return;
  }
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(file);
  video.src = currentUrl;
  now.textContent = "▶ " + s.artist + " — " + s.title;
  videoBox.style.display = "block";
  video.play().catch(() => {});
  scrollTo({ top: 0, behavior: "smooth" });
}

/* ----- IMPORT DEPUIS EXCEL / PRESSE-PAPIERS ----- */
openPasteBtn.onclick = () => pasteModal.style.display = "flex";
closePasteBtn.onclick = () => pasteModal.style.display = "none";

importPasteBtn.onclick = () => {
  let txt = pasteInput.value.trim();
  let lines = txt.split(/\r\n|\r|\n/);
  let newSongs = [];

  lines.forEach(line => {
    let raw = line.trim();
    if (!raw) return;
    let cols = raw.split(/\t|;|,|\s{2,}/).map(c => c.replace(/^["'\s]+|["'\s]+$/g, '')).filter(c => c !== "");
    if (cols.length === 2) {
      let mEnd = cols[1].match(/^(.*?)\s+(\d+)$/);
      let mStart = cols[0].match(/^(\d+)\s+(.*)$/);
      if (mEnd) {
        cols = [cols[0], mEnd[1], mEnd[2]];
      } else if (mStart) {
        cols = [mStart[1], mStart[2], cols[1]];
      }
    }
    if (cols.length >= 2) {
      let num = null, artist = "", title = "";
      if (/^\d+$/.test(cols[0])) {
        num = parseInt(cols[0], 10);
        artist = cols[1] || "";
        title = cols[2] || "";
      } 
      else if (/^\d+$/.test(cols[cols.length - 1])) {
        num = parseInt(cols[cols.length - 1], 10);
        artist = cols[0] || "";
        title = cols[1] || "";
      }
      else {
        let numIdx = cols.findIndex(c => /^\d+$/.test(c));
        if (numIdx !== -1) {
          num = parseInt(cols[numIdx], 10);
          let otherCols = cols.filter((_, idx) => idx !== numIdx);
          artist = otherCols[0] || "";
          title = otherCols[1] || "";
        }
      }
      if (num !== null && (artist || title)) {
        newSongs.push({ num, artist, title });
      }
    }
  });

  if (newSongs.length > 0) {
    songs = newSongs;
    saveSongs();
    render();
    pasteModal.style.display = "none";
    pasteInput.value = "";
    alert(newSongs.length + " chansons importées avec succès !");
  } else {
    alert("Impossible de lire les données. Vérifiez votre sélection Excel.");
  }
};

/* ----- RÉINITIALISATION ----- */
resetBtn.onclick = () => {
  if (confirm("Voulez-vous réinitialiser la liste par défaut ?")) {
    songs = [...defaultSongs];
    saveSongs();
    render();
  }
};

/* ----- PLEIN ÉCRAN ----- */
fullscreenBtn.onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
};

/* ----- RECHERCHE ET CHARGEMENT DU DOSSIER ----- */
search.oninput = render;

folder.onchange = e => {
  fileList = Array.from(e.target.files).filter(f => /\.(mp4|m4v|mov|mkv)$/i.test(f.name));
  folderStatus.textContent = fileList.length + " vidéo(s) chargée(s)";
  render();
};

render();

/* ----- PWA ----- */
// PWA - Enregistrement du Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW enregistré', reg.scope))
      .catch(err => console.log('SW erreur', err));
  });
}
</script></body></html>
